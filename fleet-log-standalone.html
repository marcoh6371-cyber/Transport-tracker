<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fleet Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #14181C; }
  * { box-sizing: border-box; }
  body { font-family: 'IBM Plex Sans', sans-serif; }
  .font-display { font-family: 'Oswald', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  .ft-input { background: #262C33; border: 1px solid #333B44; color: #E8EAED; border-radius: 8px; padding: 8px 10px; width: 100%; font-family: inherit; font-size: 14px; }
  .ft-input:focus { outline: 2px solid #F2A93B; outline-offset: 1px; }
  .ft-label { font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; color: #8B94A0; display: block; margin-bottom: 4px; }
  .ft-btn-accent { background: #F2A93B; color: #1A1305; font-weight: 600; border-radius: 8px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; transition: filter 0.15s; border: none; cursor: pointer; font-family: inherit; font-size: 14px; }
  .ft-btn-accent:hover { filter: brightness(1.08); }
  .ft-btn-outline { border: 1px solid #333B44; color: #E8EAED; border-radius: 8px; padding: 8px 14px; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s; background: transparent; cursor: pointer; font-family: inherit; font-size: 14px; }
  .ft-btn-outline:hover { background: #262C33; }
  .ft-card { background: #1D2228; border: 1px solid #333B44; border-radius: 14px; transition: border-color 0.15s; }
  .ft-card:hover { border-color: #454F5B; }
  button { font-family: inherit; }
  *:focus-visible { outline: 2px solid #F2A93B; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

// ---------- Local storage shim (mirrors the Claude persistent-storage API) ----------
const PREFIX = "fleetlog:";
const storage = {
  get: (key) => new Promise((resolve, reject) => {
    const v = localStorage.getItem(PREFIX + key);
    if (v === null) { reject(new Error("not found")); return; }
    resolve({ key, value: v });
  }),
  set: (key, value) => new Promise((resolve) => {
    localStorage.setItem(PREFIX + key, value);
    resolve({ key, value });
  }),
};

// ---------- Minimal inline icon set (no external icon library needed) ----------
function Icon({ size = 16, color, style, children }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color || "currentColor"}
      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
      {children}
    </svg>
  );
}
const Truck = (p) => <Icon {...p}><path d="M1 3h15v13H1z"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></Icon>;
const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const X = (p) => <Icon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Icon>;
const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></Icon>;
const Pencil = (p) => <Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></Icon>;
const Wallet = (p) => <Icon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></Icon>;
const Gauge = (p) => <Icon {...p}><circle cx="12" cy="12" r="9"/><line x1="12" y1="12" x2="16" y2="8"/></Icon>;
const Package = (p) => <Icon {...p}><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></Icon>;
const CheckCircle2 = (p) => <Icon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></Icon>;
const ChevronLeft = (p) => <Icon {...p}><polyline points="15 18 9 12 15 6"/></Icon>;
const ChevronRight = (p) => <Icon {...p}><polyline points="9 18 15 12 9 6"/></Icon>;
const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
const Droplet = (p) => <Icon {...p}><path d="M12 2.69s-5.5 6.4-5.5 10.31a5.5 5.5 0 0 0 11 0C17.5 9.09 12 2.69 12 2.69Z"/></Icon>;
const AlertTriangle = (p) => <Icon {...p}><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></Icon>;

// ---------- Helpers ----------
const VEHICLES_KEY = "vehicles";
const LOADS_KEY = "loads";
const DIESEL_KEY = "diesel";
const EVENTS_KEY = "events";
const SETTINGS_KEY = "settings";
const EVENT_TYPES = ["Blown tyre", "Breakdown", "Accident", "Service / maintenance", "Fine / violation", "Other"];

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const thisMonth = () => new Date().toISOString().slice(0, 7);
const today = () => new Date().toISOString().slice(0, 10);
const monthLabel = (m) => {
  const [y, mo] = m.split("-").map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
};
const num = (v) => (v === "" || v === null || v === undefined ? null : Number(v));
function shiftMonth(m, delta) {
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(y, mo - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function VehicleTracker() {
  const [loading, setLoading] = useState(true);
  const [vehicles, setVehicles] = useState([]);
  const [loads, setLoads] = useState([]);
  const [diesel, setDiesel] = useState([]);
  const [events, setEvents] = useState([]);
  const [currency, setCurrency] = useState("$");
  const [selectedMonth, setSelectedMonth] = useState(thisMonth());
  const [filterVehicle, setFilterVehicle] = useState("all");
  const [filterDieselVehicle, setFilterDieselVehicle] = useState("all");
  const [filterEventVehicle, setFilterEventVehicle] = useState("all");
  const [error, setError] = useState("");
  const [vehicleModal, setVehicleModal] = useState(null);
  const [loadModal, setLoadModal] = useState(null);
  const [dieselModal, setDieselModal] = useState(null);
  const [eventModal, setEventModal] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  useEffect(() => {
    (async () => {
      try { const v = await storage.get(VEHICLES_KEY); setVehicles(v ? JSON.parse(v.value) : []); }
      catch (e) { setVehicles([]); }
      try { const l = await storage.get(LOADS_KEY); setLoads(l ? JSON.parse(l.value) : []); }
      catch (e) { setLoads([]); }
      try { const d = await storage.get(DIESEL_KEY); setDiesel(d ? JSON.parse(d.value) : []); }
      catch (e) { setDiesel([]); }
      try { const ev = await storage.get(EVENTS_KEY); setEvents(ev ? JSON.parse(ev.value) : []); }
      catch (e) { setEvents([]); }
      try { const s = await storage.get(SETTINGS_KEY); if (s) setCurrency(JSON.parse(s.value).currency || "$"); }
      catch (e) {}
      setLoading(false);
    })();
  }, []);

  async function persistVehicles(next) {
    setVehicles(next);
    try { await storage.set(VEHICLES_KEY, JSON.stringify(next)); setError(""); }
    catch (e) { setError("Couldn't save the vehicle. Try again."); }
  }
  async function persistLoads(next) {
    setLoads(next);
    try { await storage.set(LOADS_KEY, JSON.stringify(next)); setError(""); }
    catch (e) { setError("Couldn't save the load. Try again."); }
  }
  async function persistDiesel(next) {
    setDiesel(next);
    try { await storage.set(DIESEL_KEY, JSON.stringify(next)); setError(""); }
    catch (e) { setError("Couldn't save the diesel entry. Try again."); }
  }
  async function persistEvents(next) {
    setEvents(next);
    try { await storage.set(EVENTS_KEY, JSON.stringify(next)); setError(""); }
    catch (e) { setError("Couldn't save the event. Try again."); }
  }
  async function persistCurrency(sym) {
    setCurrency(sym);
    try { await storage.set(SETTINGS_KEY, JSON.stringify({ currency: sym })); } catch (e) {}
  }

  function saveVehicle(data, id) {
    if (id) persistVehicles(vehicles.map((v) => (v.id === id ? { ...v, ...data } : v)));
    else persistVehicles([...vehicles, { id: uid(), ...data }]);
    setVehicleModal(null);
  }
  function removeVehicle(id) {
    persistVehicles(vehicles.filter((v) => v.id !== id));
    persistLoads(loads.filter((l) => l.vehicleId !== id));
    persistDiesel(diesel.filter((d) => d.vehicleId !== id));
    persistEvents(events.filter((e) => e.vehicleId !== id));
    setConfirmDelete(null);
  }
  function saveLoad(data, id) {
    if (id) persistLoads(loads.map((l) => (l.id === id ? { ...l, ...data } : l)));
    else persistLoads([...loads, { id: uid(), ...data }]);
    setLoadModal(null);
  }
  function removeLoad(id) {
    persistLoads(loads.filter((l) => l.id !== id));
    setConfirmDelete(null);
  }
  function saveDiesel(data, id) {
    if (id) persistDiesel(diesel.map((d) => (d.id === id ? { ...d, ...data } : d)));
    else persistDiesel([...diesel, { id: uid(), ...data }]);
    setDieselModal(null);
  }
  function removeDiesel(id) {
    persistDiesel(diesel.filter((d) => d.id !== id));
    setConfirmDelete(null);
  }
  function saveEvent(data, id) {
    if (id) persistEvents(events.map((e) => (e.id === id ? { ...e, ...data } : e)));
    else persistEvents([...events, { id: uid(), ...data }]);
    setEventModal(null);
  }
  function removeEvent(id) {
    persistEvents(events.filter((e) => e.id !== id));
    setConfirmDelete(null);
  }

  const monthLoads = useMemo(
    () => loads.filter((l) => (l.date || "").slice(0, 7) === selectedMonth),
    [loads, selectedMonth]
  );
  const monthDiesel = useMemo(
    () => diesel.filter((d) => (d.date || "").slice(0, 7) === selectedMonth),
    [diesel, selectedMonth]
  );
  const statsFor = (vehicleId) => {
    const vl = monthLoads.filter((l) => l.vehicleId === vehicleId);
    return {
      km: vl.reduce((s, l) => s + (Number(l.km) || 0), 0),
      revenue: vl.reduce((s, l) => s + (Number(l.price) || 0), 0),
      count: vl.length,
    };
  };
  const dieselStatsFor = (vehicleId) => {
    const vd = monthDiesel.filter((d) => d.vehicleId === vehicleId);
    return {
      litres: vd.reduce((s, d) => s + (Number(d.litres) || 0), 0),
      cost: vd.reduce((s, d) => s + (Number(d.cost) || 0), 0),
    };
  };
  const fleetTotals = useMemo(() => {
    const revenue = monthLoads.reduce((s, l) => s + (Number(l.price) || 0), 0);
    const km = monthLoads.reduce((s, l) => s + (Number(l.km) || 0), 0);
    const litres = monthDiesel.reduce((s, d) => s + (Number(d.litres) || 0), 0);
    const dieselCost = monthDiesel.reduce((s, d) => s + (Number(d.cost) || 0), 0);
    const onTarget = vehicles.filter((v) => v.targetRevenue && statsFor(v.id).revenue >= v.targetRevenue).length;
    return { revenue, km, litres, dieselCost, count: monthLoads.length, onTarget };
  }, [monthLoads, monthDiesel, vehicles]);

  const fmtMoney = (n) => `${currency}${(Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
  const fmtKm = (n) => `${(Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })} km`;
  const fmtL = (n) => `${(Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 1 })} L`;

  const visibleLoads = useMemo(() => {
    const list = monthLoads.filter((l) => filterVehicle === "all" || l.vehicleId === filterVehicle);
    return [...list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [monthLoads, filterVehicle]);

  const visibleDiesel = useMemo(() => {
    const list = monthDiesel.filter((d) => filterDieselVehicle === "all" || d.vehicleId === filterDieselVehicle);
    return [...list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [monthDiesel, filterDieselVehicle]);

  const visibleEvents = useMemo(() => {
    const list = events.filter((e) => filterEventVehicle === "all" || e.vehicleId === filterEventVehicle);
    return [...list].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  }, [events, filterEventVehicle]);

  const vehicleName = (id) => vehicles.find((v) => v.id === id)?.name || "Unknown vehicle";
  const vehiclePlate = (id) => vehicles.find((v) => v.id === id)?.plate || "";

  return (
    <div style={{ color: "#E8EAED", minHeight: "100vh" }} className="p-4">
      <div style={{ maxWidth: 1100, margin: "0 auto" }}>
        <div className="flex" style={{ flexWrap: "wrap", alignItems: "flex-start", justifyContent: "space-between", gap: 16, marginBottom: 24, display: "flex" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ background: "#F2A93B", width: 40, height: 40, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Truck size={22} color="#1A1305" />
            </div>
            <div>
              <h1 className="font-display" style={{ fontSize: 24, textTransform: "uppercase", letterSpacing: "0.03em", margin: 0 }}>Fleet Log</h1>
              <p style={{ fontSize: 12, color: "#8B94A0", margin: 0 }}>Loads, kilometres and revenue against monthly targets — running standalone, saved to this browser</p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <button className="ft-btn-outline" onClick={() => setVehicleModal("new")}><Plus size={16} /> Vehicle</button>
            <button className="ft-btn-outline" onClick={() => vehicles.length && setDieselModal({ vehicleId: vehicles[0].id })}
              disabled={!vehicles.length} style={!vehicles.length ? { opacity: 0.5, cursor: "not-allowed" } : {}}>
              <Droplet size={16} /> Log diesel
            </button>
            <button className="ft-btn-outline" onClick={() => vehicles.length && setEventModal({ vehicleId: vehicles[0].id })}
              disabled={!vehicles.length} style={!vehicles.length ? { opacity: 0.5, cursor: "not-allowed" } : {}}>
              <AlertTriangle size={16} /> Log event
            </button>
            <button className="ft-btn-accent" onClick={() => vehicles.length && setLoadModal({ vehicleId: vehicles[0].id })}
              disabled={!vehicles.length} style={!vehicles.length ? { opacity: 0.5, cursor: "not-allowed" } : {}}>
              <Plus size={16} /> Log load
            </button>
          </div>
        </div>

        {error && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, borderRadius: 8, padding: 12, marginBottom: 16, background: "rgba(232,115,74,0.1)", border: "1px solid #E8734A", color: "#E8734A" }}>
            <AlertCircle size={16} />{error}
            <button style={{ marginLeft: "auto", background: "none", border: "none", color: "#E8734A", cursor: "pointer" }} onClick={() => setError("")}><X size={14} /></button>
          </div>
        )}

        <div className="ft-card p-4" style={{ padding: 16, marginBottom: 24 }}>
          <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <button className="ft-btn-outline" style={{ padding: 8 }} onClick={() => setSelectedMonth((m) => shiftMonth(m, -1))}><ChevronLeft size={16} /></button>
              <span className="font-display" style={{ fontSize: 18, textTransform: "uppercase", minWidth: 160, textAlign: "center", display: "inline-block" }}>{monthLabel(selectedMonth)}</span>
              <button className="ft-btn-outline" style={{ padding: 8 }} onClick={() => setSelectedMonth((m) => shiftMonth(m, 1))}><ChevronRight size={16} /></button>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: "#8B94A0" }}>
              <span>Currency label</span>
              <input className="ft-input font-mono" style={{ width: 56, padding: "4px 8px", textAlign: "center" }}
                value={currency} maxLength={3} onChange={(e) => persistCurrency(e.target.value.slice(0, 3) || "$")} />
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(140px, 1fr))", gap: 12 }}>
            <StatChip icon={<Wallet size={16} />} label="Revenue" value={fmtMoney(fleetTotals.revenue)} />
            <StatChip icon={<Gauge size={16} />} label="Kilometres" value={fmtKm(fleetTotals.km)} />
            <StatChip icon={<Package size={16} />} label="Loads" value={fleetTotals.count} />
            <StatChip icon={<Droplet size={16} />} label="Diesel" value={`${fmtL(fleetTotals.litres)} · ${fmtMoney(fleetTotals.dieselCost)}`} />
            <StatChip icon={<CheckCircle2 size={16} />} label="On target" value={`${fleetTotals.onTarget} / ${vehicles.length}`} />
          </div>
        </div>

        {loading ? (
          <p style={{ fontSize: 14, color: "#8B94A0" }}>Loading fleet…</p>
        ) : vehicles.length === 0 ? (
          <div className="ft-card" style={{ padding: 32, textAlign: "center", marginBottom: 24 }}>
            <Truck size={28} style={{ margin: "0 auto 10px", color: "#8B94A0" }} />
            <p className="font-display" style={{ fontSize: 18, textTransform: "uppercase" }}>No vehicles on the board yet</p>
            <p style={{ fontSize: 14, color: "#8B94A0", marginBottom: 16 }}>Add a vehicle to start logging loads and tracking targets.</p>
            <button className="ft-btn-accent" style={{ margin: "0 auto" }} onClick={() => setVehicleModal("new")}><Plus size={16} /> Add a vehicle</button>
          </div>
        ) : (
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 16, marginBottom: 24 }}>
            {vehicles.map((v) => {
              const s = statsFor(v.id);
              const ds = dieselStatsFor(v.id);
              const eventCount = events.filter((e) => e.vehicleId === v.id).length;
              return (
                <div key={v.id} className="ft-card" style={{ padding: 16 }}>
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12 }}>
                    <div>
                      <p className="font-display" style={{ fontSize: 16, textTransform: "uppercase", margin: 0 }}>{v.name}</p>
                      {v.plate && <p className="font-mono" style={{ fontSize: 12, color: "#8B94A0", margin: 0 }}>{v.plate}</p>}
                    </div>
                    <div style={{ display: "flex", gap: 4 }}>
                      <button className="ft-btn-outline" style={{ padding: 6 }} onClick={() => setVehicleModal(v)}><Pencil size={13} /></button>
                      <button className="ft-btn-outline" style={{ padding: 6, borderColor: "#E8734A", color: "#E8734A" }} onClick={() => setConfirmDelete({ type: "vehicle", id: v.id, name: v.name })}><Trash2 size={13} /></button>
                    </div>
                  </div>
                  <RouteBar label="Revenue" value={s.revenue} target={v.targetRevenue} format={fmtMoney} onSetTarget={() => setVehicleModal(v)} />
                  <RouteBar label="Kilometres" value={s.km} target={v.targetKm} format={fmtKm} onSetTarget={() => setVehicleModal(v)} />
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", fontSize: 12, color: "#8B94A0", marginBottom: 4 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 4 }}><Droplet size={12} /> Diesel this month</span>
                    <span className="font-mono">{fmtL(ds.litres)} · {fmtMoney(ds.cost)}</span>
                  </div>
                  {eventCount > 0 && (
                    <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "#F2A93B", marginBottom: 4 }}>
                      <AlertTriangle size={12} /> {eventCount} event{eventCount === 1 ? "" : "s"} logged
                    </div>
                  )}
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 12, paddingTop: 12, borderTop: "1px solid #333B44", flexWrap: "wrap", gap: 8 }}>
                    <span style={{ fontSize: 12, color: "#8B94A0" }}>{s.count} load{s.count === 1 ? "" : "s"}{v.targetLoads ? ` / ${v.targetLoads} target` : ""}</span>
                    <div style={{ display: "flex", gap: 6 }}>
                      <button className="ft-btn-outline" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => setDieselModal({ vehicleId: v.id })}><Droplet size={13} /></button>
                      <button className="ft-btn-outline" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => setEventModal({ vehicleId: v.id })}><AlertTriangle size={13} /></button>
                      <button className="ft-btn-outline" style={{ fontSize: 12, padding: "6px 10px" }} onClick={() => setLoadModal({ vehicleId: v.id })}><Plus size={13} /> Log load</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {vehicles.length > 0 && (
          <div className="ft-card" style={{ padding: 16 }}>
            <div style={{ display: "flex", flexWrap: "wrap", alignItems: "center", justifyContent: "space-between", gap: 12, marginBottom: 12 }}>
              <p className="font-display" style={{ fontSize: 16, textTransform: "uppercase", margin: 0 }}>Loads this month</p>
              <select className="ft-input font-mono" style={{ width: "auto" }} value={filterVehicle} onChange={(e) => setFilterVehicle(e.target.value)}>
                <option value="all">All vehicles</option>

function RouteBar({ label, value, target, format, onSetTarget }) {
  const hasTarget = !!target && target > 0;
  const pct = hasTarget ? Math.min(100, (value / target) * 100) : 0;
  const actualPct = hasTarget ? Math.round((value / target) * 100) : 0;
  const reached = hasTarget && value >= target;
  return (
    <div style={{ marginBottom: 12 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.05em", color: "#8B94A0" }}>{label}</span>
        <span className="font-mono" style={{ fontSize: 12 }}>{format(value)}{hasTarget && <span style={{ color: "#8B94A0" }}> / {format(target)}</span>}</span>
      </div>
      {hasTarget ? (
        <>
          <div style={{ position: "relative", height: 6, marginTop: 10 }}>
            <div style={{ position: "absolute", inset: 0, borderRadius: 999, background: "#333B44" }} />
            <div style={{ position: "absolute", top: 0, bottom: 0, left: 0, borderRadius: 999, width: `${pct}%`, background: reached ? "#5CB88B" : "#F2A93B", transition: "width 0.5s" }} />
            <Truck size={13} style={{ position: "absolute", left: `calc(${pct}% - 7px)`, top: -9, color: reached ? "#5CB88B" : "#F2A93B", transition: "left 0.5s" }} />
          </div>
          <div className="font-mono" style={{ textAlign: "right", fontSize: 10, marginTop: 4, color: reached ? "#5CB88B" : "#8B94A0" }}>{actualPct}%</div>
        </>
      ) : (
        <button style={{ fontSize: 11, textDecoration: "underline", color: "#8B94A0", background: "none", border: "none", cursor: "pointer", padding: 0 }} onClick={onSetTarget}>Set a target</button>
      )}
    </div>
  );
}

        </div>
        <div>
          <label className="ft-label">Event type *</label>
          <select className="ft-input" value={type} onChange={(e) => setType(e.target.value)}>
            {EVENT_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div>
          <label className="ft-label">Details</label>
          <input className="ft-input" value={note} onChange={(e) => setNote(e.target.value)} placeholder="What happened, location, action taken — optional" />
        </div>
        {formError && <p style={{ fontSize: 12, color: "#E8734A", margin: 0 }}>{formError}</p>}
        <button type="submit" className="ft-btn-accent" style={{ justifyContent: "center", marginTop: 8 }}>{initial ? "Save changes" : "Log event"}</button>
      </form>
    </Modal>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<VehicleTracker />);
</script>
</body>
</html>
